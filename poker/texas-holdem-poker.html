<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキサスポーカー</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('haikei.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            position: relative;
            overflow: hidden;
            margin: 0;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 119, 198, 0.3), transparent 50%),
                        radial-gradient(circle at 40% 20%, rgba(255, 219, 98, 0.2), transparent 50%);
            pointer-events: none;
        }

        .game-container {
            width: 95%;
            height: 95vh;
            max-width: 1200px;
            margin: 0 auto;
            background: linear-gradient(135deg, rgba(20, 30, 40, 0.95), rgba(30, 40, 50, 0.95));
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6),
                        0 0 150px rgba(100, 200, 255, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .game-container:hover {
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.7),
                        0 0 200px rgba(100, 200, 255, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        h1 {
            text-align: center;
            font-size: 2em;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.5)); }
            to { filter: drop-shadow(0 0 30px rgba(118, 75, 162, 0.8)); }
        }

        .game-status {
            text-align: center;
            font-size: 1em;
            margin: 5px 0;
            padding: 8px;
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.2), rgba(139, 195, 74, 0.2));
            border-radius: 10px;
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #a5d6a7;
            font-weight: 500;
            backdrop-filter: blur(5px);
        }

        .cpu-raise-status {
            font-size: 0.9em;
            margin: 5px 0;
            padding: 8px;
            background: linear-gradient(135deg, rgba(244, 67, 54, 0.3), rgba(239, 83, 80, 0.3));
            border-radius: 10px;
            border: 1px solid rgba(244, 67, 54, 0.5);
            color: #ffcdd2;
            font-weight: 600;
            backdrop-filter: blur(5px);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        .bet-status {
            text-align: center;
            font-size: 1.2em;
            margin: 8px 0;
            color: #87ceeb;
            font-weight: 600;
            text-shadow: 0 0 15px rgba(135, 206, 235, 0.5);
        }

        .bet-status span {
            background: linear-gradient(135deg, #87ceeb, #4682b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .players-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 0 auto 10px;
            width: 90%;
            max-width: 800px;
        }

        .main-game-area {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        .table-area {
            background: radial-gradient(ellipse at center, #2e7d32, #1b5e20);
            border-radius: 20px;
            padding: 20px;
            border: 3px solid #4caf50;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.3),
                        0 10px 30px rgba(76, 175, 80, 0.3);
            position: relative;
            overflow: hidden;
            width: 90%;
            max-width: 800px;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .table-area::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .pot-info {
            text-align: center;
            font-size: 1.5em;
            margin: 10px 0;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            position: relative;
            z-index: 1;
        }

        .pot-info span {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .bet-status {
            text-align: center;
            font-size: 1.2em;
            margin: 8px 0;
            color: #87ceeb;
            font-weight: 600;
            text-shadow: 0 0 15px rgba(135, 206, 235, 0.5);
        }

        .bet-status span {
            background: linear-gradient(135deg, #87ceeb, #4682b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .community-cards {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 15px 0;
            position: relative;
            z-index: 1;
        }

        .card {
            width: 60px;
            height: 85px;
            background: linear-gradient(135deg, #ffffff, #f5f5f5);
            border: 2px solid #ddd;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            position: relative;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card:hover {
            transform: translateY(-5px) rotateY(5deg);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4),
                        0 0 20px rgba(100, 200, 255, 0.3);
        }

        .card.back {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            border: 2px solid #4169e1;
            box-shadow: 0 8px 25px rgba(30, 60, 114, 0.4);
        }

        .card.back::after {
            content: '♠';
            position: absolute;
            font-size: 30px;
            opacity: 0.3;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .card.hearts, .card.diamonds {
            color: #e74c3c;
        }

        .card.clubs, .card.spades {
            color: #2c3e50;
        }

        .suit {
            font-size: 25px;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .rank {
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .player-area {
            background: linear-gradient(135deg, rgba(30, 40, 50, 0.9), rgba(40, 50, 60, 0.9));
            border-radius: 15px;
            padding: 15px;
            border: 2px solid rgba(100, 200, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            flex: 1;
        }

        .player-area:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4),
                        0 0 20px rgba(100, 200, 255, 0.2);
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .player-info span:first-child {
            font-size: 1.2em;
            font-weight: 600;
            color: #64b5f6;
        }

        .chips {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.1em;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .player-cards {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 10px 0;
        }

        .hand-rank {
            text-align: center;
            font-size: 1.1em;
            color: #ffd700;
            margin: 10px 0;
            font-weight: bold;
            padding: 8px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: linear-gradient(135deg, #424242, #616161);
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.6;
        }

        button:disabled::before {
            display: none;
        }

        #newGameBtn {
            background: linear-gradient(135deg, #4caf50, #8bc34a);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        #newGameBtn:hover {
            background: linear-gradient(135deg, #8bc34a, #4caf50);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.6);
        }

        #foldBtn {
            background: linear-gradient(135deg, #f44336, #e91e63);
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }

        #foldBtn:hover {
            background: linear-gradient(135deg, #e91e63, #f44336);
            box-shadow: 0 8px 25px rgba(244, 67, 54, 0.6);
        }

        .bet-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin: 10px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bet-input {
            padding: 8px;
            border-radius: 8px;
            border: 2px solid rgba(100, 200, 255, 0.3);
            font-size: 14px;
            width: 80px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .bet-input:focus {
            outline: none;
            border-color: rgba(100, 200, 255, 0.6);
            box-shadow: 0 0 15px rgba(100, 200, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .bet-adjust-btn {
            background: linear-gradient(135deg, #4caf50, #8bc34a);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
            min-width: 40px;
        }

        .bet-adjust-btn:hover {
            background: linear-gradient(135deg, #8bc34a, #4caf50);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }

        .bet-adjust-btn:active {
            transform: translateY(0);
        }

        #decreaseBetBtn {
            background: linear-gradient(135deg, #f44336, #e91e63);
            box-shadow: 0 2px 8px rgba(244, 67, 54, 0.3);
        }

        #decreaseBetBtn:hover {
            background: linear-gradient(135deg, #e91e63, #f44336);
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.4);
        }

        .bet-confirm-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .bet-confirm-btn:hover {
            background: linear-gradient(135deg, #764ba2, #667eea);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .bet-cancel-btn {
            background: linear-gradient(135deg, #9e9e9e, #757575);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(158, 158, 158, 0.3);
        }

        .bet-cancel-btn:hover {
            background: linear-gradient(135deg, #757575, #9e9e9e);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(158, 158, 158, 0.4);
        }

        .bet-controls span {
            color: #b0bec5;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .game-container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .card {
                width: 60px;
                height: 85px;
            }
            
            .suit {
                font-size: 25px;
            }
            
            .rank {
                font-size: 22px;
            }
            
            button {
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>テキサスポーカー</h1>
        
        <div class="game-status" id="gameStatus">新しいゲームを開始してください</div>
        
        <div class="main-game-area">
            <div class="table-area">
                <div class="pot-info">
                    ポット: <span id="potAmount">0</span> チップ
                </div>
                
                <div class="bet-status" id="betStatus">
                    現在のベット: <span id="currentBetDisplay">0</span> チップ
                </div>
                
                <div class="cpu-raise-status" id="cpuRaiseStatus" style="display: none;">
                    CPUが <span id="cpuRaiseAmount">0</span> チップレイズしました
                </div>
                
                <div class="community-cards" id="communityCards">
                    <!-- コミュニティカードがここに表示される -->
                </div>
            </div>
        </div>
        
        <div class="players-container">
            <div class="player-area">
                <div class="player-info">
                    <span>Player</span>
                    <span class="chips">チップ: <span id="playerChips">1000</span></span>
                </div>
                <div class="player-cards" id="playerCards">
                    <!-- プレイヤーのカード -->
                </div>
                <div class="hand-rank" id="playerHandRank"></div>
            </div>
            
            <div class="player-area">
                <div class="player-info">
                    <span>CPU</span>
                    <span class="chips" style="display: none;">チップ: <span id="computerChips">1000</span></span>
                </div>
                <div class="player-cards" id="computerCards">
                    <!-- コンピューターのカード -->
                </div>
                <div class="hand-rank" id="computerHandRank"></div>
            </div>
        </div>
        
        <div class="controls">
            <button id="homeBtn" style="background: linear-gradient(135deg, #757575, #424242); box-shadow: 0 4px 15px rgba(0,0,0,0.3);">ホームへ戻る</button>
            <button id="newGameBtn">新しいゲーム</button>
            <button id="checkBtn" disabled>チェック</button>
            <button id="callBtn" disabled>コール</button>
            <button id="raiseBtn" disabled>レイズ</button>
            <button id="foldBtn" disabled>フォールド</button>
        </div>
        
        <div class="bet-controls" id="betControls" style="display: none;">
            <button id="decreaseBetBtn" class="bet-adjust-btn">−100</button>
            <input type="number" id="betAmount" class="bet-input" min="10" step="10" value="10">
            <button id="increaseBetBtn" class="bet-adjust-btn">+100</button>
            <button id="confirmRaiseBtn" class="bet-confirm-btn">レイズ確定</button>
            <button id="cancelRaiseBtn" class="bet-cancel-btn">キャンセル</button>
        </div>
    </div>

    <script src="handEvaluator.js"></script>
<script src="poker.js"></script>
</body>
</html>
