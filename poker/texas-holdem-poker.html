<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキサスポーカー</title>
    <style>
        :root {
            /* ワインレッド・カジノテーマ（カイジのブラックジャックと共通） */
            --wine-dark: #1a0a0c;
            --wine: #5c1520;
            --wine-mid: #7a1f2e;
            --wine-light: #9b2d3f;
            --wine-glow: #c43d52;
            --gold: #d4a84b;
            --gold-light: #f0d078;
            --gold-dark: #8b6914;
            --felt: #2d1218;
            --felt-edge: #4a1a24;
            --text: #f5e6e8;
            --text-muted: #c9a8ad;
            --card-white: #faf8f5;
            --shadow: rgba(0, 0, 0, 0.55);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background: radial-gradient(circle at center, #2a0f14 0%, var(--wine-dark) 100%), url('haikei.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow: hidden;
            position: relative;
        }

        /* 右上の音量コントロール */
        #volumeControl {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(26, 10, 12, 0.7);
            border: 1px solid var(--felt-edge);
            border-radius: 30px;
            padding: 6px 14px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #volumeControl .vol-icon {
            font-size: 1rem;
            cursor: pointer;
            user-select: none;
            color: var(--text-muted);
            transition: color 0.2s;
            min-width: 1.2em;
            text-align: center;
        }
        #volumeControl .vol-icon:hover { color: var(--gold-light); }

        .vol-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }
        .vol-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        input[type="range"].vol-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 4px;
            background: rgba(212, 168, 75, 0.25);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        input[type="range"].vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 6px rgba(212, 168, 75, 0.6);
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }
        input[type="range"].vol-slider::-webkit-slider-thumb:hover {
            background: var(--gold-light);
            box-shadow: 0 0 10px rgba(212, 168, 75, 0.9);
        }
        input[type="range"].vol-slider::-moz-range-thumb {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--gold);
            border: none;
            cursor: pointer;
        }
        .vol-sep {
            width: 1px;
            height: 28px;
            background: var(--felt-edge);
            margin: 0 2px;
        }

        /* 左上の高級感あるホーム（退室）ボタン */
        #homeBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            padding: 8px 18px;
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text-muted);
            background: rgba(26, 10, 12, 0.85);
            border: 1px solid var(--felt-edge);
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }
        #homeBtn:hover {
            background: var(--wine-mid);
            color: var(--gold-light);
            border-color: var(--gold-dark);
            box-shadow: 0 0 15px rgba(212, 168, 75, 0.35);
            transform: translateY(-1px);
        }

        /* メインコンテナ */
        .game-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 950px;
            height: calc(100vh - 30px);
            max-height: 820px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            text-align: center;
            flex-shrink: 0;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 6px;
            margin-bottom: 2px;
            background-image: linear-gradient(135deg, var(--gold-light) 30%, var(--text) 70%, var(--gold) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
        }

        .pot-container {
            background: rgba(26, 10, 12, 0.7);
            border: 1px solid rgba(212, 168, 75, 0.4);
            border-radius: 20px;
            padding: 4px 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .pot-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .pot-amount {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--gold-light);
            text-shadow: 0 0 8px rgba(212, 168, 75, 0.4);
        }

        /* 楕円のテーブル */
        .table-area {
            flex: 1;
            background: radial-gradient(ellipse at center, var(--felt) 0%, #1f0c10 100%);
            border: 6px solid var(--felt-edge);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 8px 25px rgba(0,0,0,0.5);
            border-radius: 100px;
            margin: 12px 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px 30px;
            position: relative;
            min-height: 380px;
        }

        .table-area::after {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px solid rgba(212, 168, 75, 0.12);
            border-radius: 92px;
            pointer-events: none;
        }

        .player-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            padding: 4px;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            background: rgba(26, 10, 12, 0.6);
            padding: 2px 14px;
            border-radius: 15px;
            font-size: 0.9rem;
            border: 1px solid rgba(212, 168, 75, 0.1);
        }

        .chips {
            color: var(--gold-light);
            font-weight: bold;
        }

        .player-cards {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        /* リアル・モダンカードデザイン */
        .card {
            width: 68px;
            height: 98px;
            background: #fdfdfd;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px 6px;
            position: relative;
            overflow: hidden;
            border: 1px solid #dddddd;
            transition: transform 0.2s ease;
        }

        .card::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px; right: 3px; bottom: 3px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 4px;
            pointer-events: none;
        }

        .card.hearts, .card.diamonds { color: #cf2a2a !important; }
        .card.clubs, .card.spades { color: #242426 !important; }

        .card .suit {
            font-size: 1.1rem;
            line-height: 1;
            font-weight: 900;
        }
        
        .card .rank {
            text-align: right;
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1;
        }

        .card::before {
            position: absolute;
            top: 52%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.8rem;
            opacity: 0.08;
            font-weight: normal;
            pointer-events: none;
        }
        .card.hearts::before { content: '♥'; }
        .card.diamonds::before { content: '♦'; }
        .card.clubs::before { content: '♣'; }
        .card.spades::before { content: '♠'; }

        /* 裏向きカード */
        .card.back {
            background: linear-gradient(135deg, var(--wine-mid) 0%, var(--wine-glow) 50%, var(--wine-dark) 100%) !important;
            border: 2px solid var(--gold);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            color: transparent !important;
        }
        .card.back::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(212, 168, 75, 0.25);
            background-image: radial-gradient(rgba(212,168,75,0.18) 1px, transparent 0);
            background-size: 6px 6px;
            border-radius: 3px;
        }
        .card.back::before {
            content: '👑';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.4rem;
            opacity: 0.7;
            z-index: 2;
        }

        .hand-rank {
            margin-top: 4px;
            font-size: 0.8rem;
            background: rgba(196, 61, 82, 0.15);
            border: 1px solid rgba(196, 61, 82, 0.3);
            padding: 1px 12px;
            border-radius: 10px;
            min-height: 20px;
            color: var(--gold-light);
        }

        /* --- 前からある他のCSSルール --- */

        /* コミュニティカード */
        .community-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .community-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .community-cards {
            display: flex;
            gap: 10px;
            justify-content: center;
            min-height: 114px;
            background: rgba(0,0,0,0.25);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(212, 168, 75, 0.06);
            min-width: 400px;
            align-items: center;
        }

        /* ♣♦♥♠ 操作ボタンエリア（重厚3D＆ネオングロウデザイン） ♠♥♦♣ */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            flex-shrink: 0;
            padding: 5px 0;
        }

        button {
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 800;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            color: white;
            letter-spacing: 1.5px;
            position: relative;
            transition: all 0.1s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        /* ［新しいゲーム］高貴なゴールド＆ダークゴールド */
        #newGameBtn {
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-dark) 100%);
            color: var(--wine-dark);
            text-shadow: 0 1px 2px rgba(255,255,255,0.4);
            box-shadow: 0 6px 0 #6b4c00, 0 8px 20px rgba(0,0,0,0.5);
        }
        #newGameBtn:not(:disabled):hover {
            background: linear-gradient(180deg, #fbe6a8 0%, var(--gold) 100%);
            box-shadow: 0 6px 0 #6b4c00, 0 8px 25px rgba(212, 168, 75, 0.4);
        }

        /* ［チェック / コール / レイズ］ワインレッドのカジノチップ */
        #checkBtn, #callBtn, #raiseBtn {
            background: linear-gradient(180deg, var(--wine-glow) 0%, var(--wine) 100%);
            box-shadow: 0 6px 0 var(--wine-dark), 0 8px 20px rgba(0,0,0,0.5);
        }
        #checkBtn:not(:disabled):hover, #callBtn:not(:disabled):hover, #raiseBtn:not(:disabled):hover {
            background: linear-gradient(180deg, var(--wine-light) 0%, var(--wine-glow) 100%);
            box-shadow: 0 6px 0 var(--wine-dark), 0 8px 25px rgba(196, 61, 82, 0.4);
        }

        /* ［フォールド］鉄のようなチャコールプレステージグレー */
        #foldBtn {
            background: linear-gradient(180deg, #55555c 0%, #2b2b2e 100%);
            box-shadow: 0 6px 0 #18181a, 0 8px 20px rgba(0,0,0,0.5);
        }
        #foldBtn:not(:disabled):hover {
            background: linear-gradient(180deg, #696973 0%, #3d3d42 100%);
            box-shadow: 0 6px 0 #18181a, 0 8px 25px rgba(100,100,100,0.3);
        }

        /* 全ボタン共通：クリックした時のリアルな沈み込み演出 */
        button:not(:disabled):active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #111, 0 4px 10px rgba(0,0,0,0.6) !important;
        }

        /* 無効化（disabled）時のプラスチックのようなマット加工 */
        button:disabled {
            background: linear-gradient(180deg, #2a2a2a 0%, #1c1c1c 100%) !important;
            color: #555555 !important;
            border: none !important;
            box-shadow: 0 2px 0 #111, 0 4px 8px rgba(0,0,0,0.2) !important;
            opacity: 0.4;
            cursor: not-allowed;
            transform: translateY(4px) !important; /* 最初から押し込まれた状態にする */
            text-shadow: none !important;
        }

        /* レイズ調整エリア */
        .bet-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(26, 10, 12, 0.9);
            padding: 8px 16px;
            border-radius: 25px;
            border: 1px solid rgba(212, 168, 75, 0.3);
            margin: 6px auto 0 auto;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            z-index: 3;
        }

        .bet-adjust-btn {
            background: var(--wine);
            padding: 6px 24px;
            font-size: 0.8rem;
            border-radius: 12px;
            color: var(--text);
            border: none;
            cursor: pointer;
        }

        .bet-input {
            width: 180px;
            background: var(--wine-dark);
            border: 1px solid rgba(212, 168, 75, 0.4);
            border-radius: 6px;
            color: var(--gold-light);
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            padding: 4px;
        }

        .bet-confirm-btn {
            background: linear-gradient(135deg, var(--wine-glow), var(--wine));
            border: none;
            color: var(--text);
            padding: 6px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .game-message {
            text-align: center;
            font-size: 1rem;
            font-weight: 500;
            min-height: 24px;
            color: var(--gold-light);
            margin-bottom: 2px;
            z-index: 2;
        }

        #cpuRaiseStatus {
            background: var(--wine-glow);
            color: var(--text);
            padding: 1px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            margin-left: 6px;
            font-weight: bold;
        }


        /* ==================== タイトル画面 ==================== */
        #titleScreen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center, var(--wine) 0%, var(--wine-dark) 50%, #0c0507 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .title-card {
            background: linear-gradient(160deg, var(--wine-mid) 0%, var(--wine-dark) 60%, #220a0e 100%);
            border: 1.5px solid var(--gold-dark);
            border-radius: 18px;
            padding: 48px 52px 40px;
            width: 420px;
            max-width: 92vw;
            box-shadow: 0 0 60px rgba(139,105,20,0.25), 0 24px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(212,168,75,0.1);
            text-align: center;
        }

        .title-game-name {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            line-height: 1.3;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 40%, #fff3a0 70%, var(--gold-dark) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .title-subtitle {
            font-size: 0.82rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 36px;
        }

        .title-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--wine-mid) 60%, var(--wine-dark) 100%);
            border: 2.5px solid var(--gold-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            margin: 0 auto 28px;
            box-shadow: 0 0 20px rgba(139,105,20,0.35);
        }

        .title-quote {
            font-size: 0.88rem;
            color: var(--gold);
            letter-spacing: 1px;
            margin-bottom: 32px;
            line-height: 1.6;
            font-style: italic;
        }

        .title-stats {
            border-top: 1px solid rgba(139,105,20,0.3);
            padding-top: 20px;
            margin-bottom: 28px;
        }

        .title-stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 0.88rem;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(139,105,20,0.1);
        }
        .title-stat-row:last-child { border-bottom: none; }

        .title-stat-val {
            font-weight: 800;
            color: var(--gold-light);
            font-size: 0.95rem;
        }
        .title-stat-val.debt-val { color: #ff6b7a; }
        .title-stat-val.repaid-val { color: #7dffb8; }

        .title-start-btn {
            width: 100%;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 60%, var(--gold-dark) 100%);
            color: var(--wine-dark);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #6b4c00, 0 8px 20px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            text-shadow: 0 1px 0 rgba(255,255,255,0.3);
        }
        .title-start-btn:hover {
            background: linear-gradient(180deg, #fbe6a8 0%, var(--gold) 60%, var(--gold-dark) 100%);
            box-shadow: 0 5px 0 #6b4c00, 0 8px 28px rgba(212,168,75,0.35);
        }
        .title-start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #6b4c00, 0 4px 10px rgba(0,0,0,0.5) !important;
        }

        /* ===================================================
        【文字版】オールインの時に四つ隅をざわざわさせるCSS
        =================================================== */
        .zawazawa-text {
            position: fixed;
            font-family: 'Georgia', 'Hiragino Mincho ProN', serif; /* 不気味さを出すために明朝体っぽく */
            font-size: 5rem;        /* 文字の大きさ */
            font-weight: bold;
            color: var(--wine-glow);  /* 血のような赤色（ワインレッドテーマに統一） */
            text-shadow: 0 0 10px rgba(0,0,0,0.8); /* 文字の後ろに黒い影を入れて見やすく */
            line-height: 1.2;
            opacity: 0;               /* 普段は透明 */
            pointer-events: none;     /* クリックの邪魔をしない */
            transition: opacity 1s ease-in-out;
            z-index: 9999;            /* 最前面に表示 */
        }

        /* 四つ隅の位置合わせ */
        .zawa-top-left     { top: 40px; left: 40px; }
        .zawa-top-right    { top: 40px; right: 40px; } 
        .zawa-bottom-left  { bottom: 40px; left: 40px; }
        .zawa-bottom-right { bottom: 40px; right: 40px; }

        /* ざわざわと不気味に震えるアニメーション */
        @keyframes zawaVibration {
            0%   { transform: translate(0, 0) scale(1); }
            20%  { transform: translate(-2px, 2px) scale(1.03); }
            40%  { transform: translate(1px, -1px) scale(0.98); }
            60%  { transform: translate(-1px, -2px) scale(1.05); }
            80%  { transform: translate(2px, 1px) scale(0.97); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* オールイン状態（bodyに all-in-active クラスがついた時）にうっすら表示して震わせる */
        body.all-in-active .zawazawa-text {
            opacity: 0.5; /* 透過度（0.5 = 半透明。もっと薄くしたければ 0.3 とかにしてください） */
            animation: zawaVibration 0.5s infinite linear; /* 高速でガタガタ震えます */
        }

        /* 音量バーを右上に固定する設定 */
        .volume-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000; /* 他の要素より手前に表示 */
        }

        #volume-control-pane {
            background: rgba(0, 0, 0, 0.7); /* 少し濃い背景で視認性アップ */
            padding: 8px 12px;
            border-radius: 20px; /* 角を丸く */
            color: #fff;
            font-size: 14px;
        }

        #global-volume-slider {
            cursor: pointer;
            vertical-align: middle;
        }
        </style>
    </head>
    <body>
    
    <button id="homeBtn" onclick="location.href='../home/home.html';">← ホームへ戻る</button>

    <!-- 💡 右上に固定するためのコンテナ -->
    <div class="volume-container">

    <script>
    // ==================== 借金・返済システム ====================
    const INITIAL_DEBT = 24000000000; // 借金返済目標：240億ペリカ

    const DebtManager = {
        getDebt()   { return parseInt(localStorage.getItem('bugging_debt'))   ?? INITIAL_DEBT; },
        getRepaid() { return parseInt(localStorage.getItem('bugging_repaid')) || 0; },
        getChips()  { return parseInt(localStorage.getItem('bugging_cash'))   || 10000000; },

        // 借金を初期化（初回のみ）
        init() {
            if (localStorage.getItem('bugging_debt') === null) {
                localStorage.setItem('bugging_debt', INITIAL_DEBT);
            }
            if (localStorage.getItem('bugging_repaid') === null) {
                localStorage.setItem('bugging_repaid', 0);
            }
        },

        // 現在のchipsが以前より増えた分を返済に充当する
        // prevChips: 前回記録した手持ち（セッション開始時点）
        settle(prevChips) {
            const nowChips = this.getChips();
            const gained = nowChips - prevChips;
            if (gained <= 0) return; // 増えていなければ返済なし
            let debt = this.getDebt();
            let repaid = this.getRepaid();
            const payment = Math.min(gained, debt);
            debt   = Math.max(0, debt - payment);
            repaid += payment;
            localStorage.setItem('bugging_debt',   debt);
            localStorage.setItem('bugging_repaid', repaid);
            this.updateHud();
        },

        // タイトル画面の数値を更新
        updateHud() {}
    };

    // 初期化
    DebtManager.init();

    // セッション開始時の手持ちを記録（返済計算の基準）
    const sessionStartChips = DebtManager.getChips();

    // ==================== タイトル画面 ====================
    (function() {
        const titleScreen  = document.getElementById('titleScreen');
        const titleStartBtn = document.getElementById('titleStartBtn');

        function fmt(v) { return Number(v).toLocaleString('ja-JP') + ' ペリカ'; }

        function updateTitleStats() {
            const chips  = DebtManager.getChips(); // 手持ち（チップ）
            
            // 【修正】返済累計 ＝ 手持ち
            const repaid = chips;
            
            // 【修正】借金残高 ＝ 240億(INITIAL_DEBT) − 手持ち
            const debt   = Math.max(0, INITIAL_DEBT - chips);
            
            // 表示用にlocalStorageを最新化
            localStorage.setItem('bugging_debt', debt);
            
            document.getElementById('titleChips').textContent  = fmt(chips);
            document.getElementById('titleDebt').textContent   = fmt(debt);
            document.getElementById('titleRepaid').textContent = fmt(repaid);
        }

        updateTitleStats();

        titleStartBtn.addEventListener('click', function() {
            titleScreen.style.transition = 'opacity 0.5s ease';
            titleScreen.style.opacity = '0';
            setTimeout(function() {
                titleScreen.style.display = 'none';
                // BGM再生
                var bgm = document.getElementById('bgm');
                if (bgm) bgm.play().catch(function(){});
            }, 500);
        });
    })();
    </script>
