<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキサスポーカー</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background: radial-gradient(circle at center, #2b0000 0%, #0f0000 100%), url('haikei.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #f5f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow: hidden;
            position: relative;
        }

        /* 左上の高級感あるホーム（退室）ボタン */
        #homeBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            padding: 8px 18px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #ffb3b3;
            background: rgba(40, 0, 0, 0.6);
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }
        #homeBtn:hover {
            background: #ff3b30;
            color: white;
            border-color: #ff6b64;
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.5);
            transform: translateY(-1px);
        }

        /* メインコンテナ */
        .game-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 950px;
            height: calc(100vh - 30px);
            max-height: 820px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            text-align: center;
            flex-shrink: 0;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 6px;
            margin-bottom: 2px;
            background-image: linear-gradient(135deg, #ffffff 30%, #ffcccb 70%, #d4af37 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
        }

        .pot-container {
            background: rgba(20, 0, 0, 0.7);
            border: 1px solid rgba(255, 69, 58, 0.4);
            border-radius: 20px;
            padding: 4px 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .pot-label {
            font-size: 0.75rem;
            color: #ff9f9f;
            letter-spacing: 1px;
        }

        .pot-amount {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffdf00;
            text-shadow: 0 0 8px rgba(255, 223, 0, 0.4);
        }

        /* 楕円のテーブル */
        .table-area {
            flex: 1;
            background: radial-gradient(circle at center, #8b0000 0%, #4a0000 70%, #1a0000 100%);
            border: 6px solid #221111;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 8px 25px rgba(0,0,0,0.5);
            border-radius: 100px;
            margin: 12px 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px 30px;
            position: relative;
            min-height: 380px;
        }

        .table-area::after {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 92px;
            pointer-events: none;
        }

        .player-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            padding: 4px;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 14px;
            border-radius: 15px;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .chips {
            color: #ffcc00;
            font-weight: bold;
        }

        .player-cards {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        /* リアル・モダンカードデザイン */
        .card {
            width: 68px;
            height: 98px;
            background: #fdfdfd;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px 6px;
            position: relative;
            overflow: hidden;
            border: 1px solid #dddddd;
            transition: transform 0.2s ease;
        }

        .card::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px; right: 3px; bottom: 3px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 4px;
            pointer-events: none;
        }

        .card.hearts, .card.diamonds { color: #cf2a2a !important; }
        .card.clubs, .card.spades { color: #242426 !important; }

        .card .suit {
            font-size: 1.1rem;
            line-height: 1;
            font-weight: 900;
        }
        
        .card .rank {
            text-align: right;
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1;
        }

        .card::before {
            position: absolute;
            top: 52%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.8rem;
            opacity: 0.08;
            font-weight: normal;
            pointer-events: none;
        }
        .card.hearts::before { content: '♥'; }
        .card.diamonds::before { content: '♦'; }
        .card.clubs::before { content: '♣'; }
        .card.spades::before { content: '♠'; }

        /* 裏向きカード */
        .card.back {
            background: linear-gradient(135deg, #700000 0%, #b21212 50%, #600000 100%) !important;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            color: transparent !important;
        }
        .card.back::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-image: radial-gradient(rgba(255,255,255,0.15) 1px, transparent 0);
            background-size: 6px 6px;
            border-radius: 3px;
        }
        .card.back::before {
            content: '👑';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.4rem;
            opacity: 0.7;
            z-index: 2;
        }

        .hand-rank {
            margin-top: 4px;
            font-size: 0.8rem;
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            padding: 1px 12px;
            border-radius: 10px;
            min-height: 20px;
            color: #ffcccc;
        }

        /* --- 前からある他のCSSルール --- */

        /* コミュニティカード */
        .community-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .community-label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .community-cards {
            display: flex;
            gap: 10px;
            justify-content: center;
            min-height: 114px;
            background: rgba(0,0,0,0.25);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.03);
            min-width: 400px;
            align-items: center;
        }

        /* ♣♦♥♠ 操作ボタンエリア（重厚3D＆ネオングロウデザイン） ♠♥♦♣ */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            flex-shrink: 0;
            padding: 5px 0;
        }

        button {
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 800;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            color: white;
            letter-spacing: 1.5px;
            position: relative;
            transition: all 0.1s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        /* ［新しいゲーム］高貴なゴールド＆ダークゴールド */
        #newGameBtn {
            background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%);
            color: #3a2200;
            text-shadow: 0 1px 2px rgba(255,255,255,0.4);
            box-shadow: 0 6px 0 #7a5803, 0 8px 20px rgba(0,0,0,0.5);
        }
        #newGameBtn:not(:disabled):hover {
            background: linear-gradient(180deg, #ffe240 0%, #d49b06 100%);
            box-shadow: 0 6px 0 #7a5803, 0 8px 25px rgba(255, 215, 0, 0.4);
        }

        /* ［チェック / コール / レイズ］重厚な深紅のカジノチップ・レッド */
        #checkBtn, #callBtn, #raiseBtn {
            background: linear-gradient(180deg, #dd2727 0%, #8a0505 100%);
            box-shadow: 0 6px 0 #570000, 0 8px 20px rgba(0,0,0,0.5);
        }
        #checkBtn:not(:disabled):hover, #callBtn:not(:disabled):hover, #raiseBtn:not(:disabled):hover {
            background: linear-gradient(180deg, #f03e3e 0%, #a60808 100%);
            box-shadow: 0 6px 0 #570000, 0 8px 25px rgba(221, 39, 39, 0.4);
        }

        /* ［フォールド］鉄のようなチャコールプレステージグレー */
        #foldBtn {
            background: linear-gradient(180deg, #55555c 0%, #2b2b2e 100%);
            box-shadow: 0 6px 0 #18181a, 0 8px 20px rgba(0,0,0,0.5);
        }
        #foldBtn:not(:disabled):hover {
            background: linear-gradient(180deg, #696973 0%, #3d3d42 100%);
            box-shadow: 0 6px 0 #18181a, 0 8px 25px rgba(100,100,100,0.3);
        }

        /* 全ボタン共通：クリックした時のリアルな沈み込み演出 */
        button:not(:disabled):active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #111, 0 4px 10px rgba(0,0,0,0.6) !important;
        }

        /* 無効化（disabled）時のプラスチックのようなマット加工 */
        button:disabled {
            background: linear-gradient(180deg, #2a2a2a 0%, #1c1c1c 100%) !important;
            color: #555555 !important;
            border: none !important;
            box-shadow: 0 2px 0 #111, 0 4px 8px rgba(0,0,0,0.2) !important;
            opacity: 0.4;
            cursor: not-allowed;
            transform: translateY(4px) !important; /* 最初から押し込まれた状態にする */
            text-shadow: none !important;
        }

        /* レイズ調整エリア */
        .bet-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(20, 0, 0, 0.9);
            padding: 8px 16px;
            border-radius: 25px;
            border: 1px solid rgba(255, 59, 48, 0.3);
            margin: 6px auto 0 auto;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            z-index: 3;
        }

        .bet-adjust-btn {
            background: #3a0000;
            padding: 6px 24px;
            font-size: 0.8rem;
            border-radius: 12px;
            color: white;
            border: none;
            cursor: pointer;
        }

        .bet-input {
            width: 180px;
            background: #0a0000;
            border: 1px solid rgba(255, 59, 48, 0.4);
            border-radius: 6px;
            color: #ffdf00;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            padding: 4px;
        }

        .bet-confirm-btn {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .game-message {
            text-align: center;
            font-size: 1rem;
            font-weight: 500;
            min-height: 24px;
            color: #ffcccc;
            margin-bottom: 2px;
            z-index: 2;
        }

        #cpuRaiseStatus {
            background: #dc2626;
            color: white;
            padding: 1px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            margin-left: 6px;
            font-weight: bold;
        }


        /* ===================================================
        【文字版】オールインの時に四つ隅をざわざわさせるCSS
        =================================================== */
        .zawazawa-text {
            position: fixed;
            font-family: 'Georgia', 'Hiragino Mincho ProN', serif; /* 不気味さを出すために明朝体っぽく */
            font-size: 2.5rem;        /* 文字の大きさ */
            font-weight: bold;
            color: #c00000;           /* 血のような赤色（好みの色に変えてOK） */
            text-shadow: 0 0 10px rgba(0,0,0,0.8); /* 文字の後ろに黒い影を入れて見やすく */
            line-height: 1.2;
            opacity: 0;               /* 普段は透明 */
            pointer-events: none;     /* クリックの邪魔をしない */
            transition: opacity 1s ease-in-out;
            z-index: 9999;            /* 最前面に表示 */
        }

        /* 四つ隅の位置合わせ */
        .zawa-top-left     { top: 40px; left: 40px; }
        .zawa-top-right    { top: 40px; right: 40px; } 
        .zawa-bottom-left  { bottom: 40px; left: 40px; }
        .zawa-bottom-right { bottom: 40px; right: 40px; }

        /* ざわざわと不気味に震えるアニメーション */
        @keyframes zawaVibration {
            0%   { transform: translate(0, 0) scale(1); }
            20%  { transform: translate(-2px, 2px) scale(1.03); }
            40%  { transform: translate(1px, -1px) scale(0.98); }
            60%  { transform: translate(-1px, -2px) scale(1.05); }
            80%  { transform: translate(2px, 1px) scale(0.97); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* オールイン状態（bodyに all-in-active クラスがついた時）にうっすら表示して震わせる */
        body.all-in-active .zawazawa-text {
            opacity: 0.5; /* 透過度（0.5 = 半透明。もっと薄くしたければ 0.3 とかにしてください） */
            animation: zawaVibration 0.5s infinite linear; /* 高速でガタガタ震えます */
        }

        /* 音量バーを右上に固定する設定 */
        .volume-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000; /* 他の要素より手前に表示 */
        }

        #volume-control-pane {
            background: rgba(0, 0, 0, 0.7); /* 少し濃い背景で視認性アップ */
            padding: 8px 12px;
            border-radius: 20px; /* 角を丸く */
            color: #fff;
            font-size: 14px;
        }

        #global-volume-slider {
            cursor: pointer;
            vertical-align: middle;
        }
        </style>
    </head>
    <body>
    
    <button id="homeBtn" onclick="location.href='../home/home.html';">← ホームへ戻る</button>

    <!-- 💡 右上に固定するためのコンテナ -->
    <div class="volume-container">
        <div id="volume-control-pane">
            <span id="vol-icon">音量</span>
            <input type="range" id="global-volume-slider" min="0" max="1" step="0.05" value="0.2">
            <span id="global-volume-val">20%</span>
        </div>
    </div>

    <div class="game-container">
        <header>
            <h1>TEXAS HOLD'EM</h1>
            <div class="pot-container">
                <span class="pot-label">TOTAL POT</span>
                <div class="pot-amount"><span id="potAmount">0</span>ペリカ</div>
            </div>
        </header>
        
        <div class="game-message" id="gameStatus">新しいゲームを始めてください</div>
        
        <div class="table-area">
            <div class="player-area" id="computerSection">
                <div class="player-info">
                    <span>ハンチョウ</span>
    <span id="computerChips" style="display: none;"></span>                    <span id="cpuRaiseStatus" style="display: none;">レイズ: <span id="cpuRaiseAmount">0</span></span>
                </div>
                <div class="player-cards" id="computerCards"></div>
                <div class="hand-rank" id="computerHandRank"></div>
            </div>
            
            <div class="community-section">
                <div class="community-label">Community Cards</div>
                <div class="community-cards" id="communityCards"></div>
            </div>
            
            <div class="player-area" id="playerSection">
                <div class="player-info">
                    <span>YOU</span>
                    <span class="chips"><span id="playerChips">1000</span>ペリカ</span>
                </div>
                <div class="player-cards" id="playerCards"></div>
                <div class="hand-rank" id="playerHandRank"></div>
            </div>
        </div>
        
        <div class="controls">
            <button id="newGameBtn">新しいゲーム</button>
            <button id="checkBtn" disabled>チェック</button>
            <button id="callBtn" disabled>コール</button>
            <button id="raiseBtn" disabled>レイズ</button>
            <button id="foldBtn" disabled>フォールド</button>
        </div>
        
        <div class="bet-controls" id="betControls" style="display: none;">
            <button id="decreaseBetBtn" class="bet-adjust-btn">−1000万ペリカ</button>
            <input type="number" id="betAmount" class="bet-input" min="10" step="10" value="10">
            <button id="increaseBetBtn" class="bet-adjust-btn">+1000万ペリカ</button>
            <button id="confirmRaiseBtn" class="bet-confirm-btn">確定</button>
            <button id="cancelRaiseBtn" class="bet-adjust-btn" style="background: #111;">×</button>
        </div>
    </div>

    <audio id="bgm" src="casino%202.mp3" loop></audio>
    <audio id="clickSe" src="決定ボタンを押す50.mp3"></audio>
    <audio id="cardFlipSe" src="カードをめくる.mp3"></audio>
    <audio id="impactSe" src="文字表示の衝撃音3.mp3"></audio>

    <div class="zawazawa-text zawa-top-left">ざわ…<br>　　ざわ…</div>
    <div class="zawazawa-text zawa-top-right">　　　ざわ… <br>ざわ…</div>
    <div class="zawazawa-text zawa-bottom-left">　　ざわ…<br>ざわ…</div>
    <div class="zawazawa-text zawa-bottom-right"> ざわ…<br>　　ざわ…</div>
    
    <script src="handEvaluator.js"></script>
    <script src="poker.js"></script>
</body>
</html>
