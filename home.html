<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Bugging</title>

    <style>

        /* 背景 */
        body {
            background-image: url("画像_half_trans.png");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;

            margin: 0;
            padding: 0;
        }

        /* フォント */
        @font-face {
            font-family: "Bluetag";

            src: url("BluetagBoldItalic_PERSONAL_USE_ONLY.otf")
            format("opentype");

            font-display: swap;
        }

        @font-face {
            font-family: "Oiwai";

            src: url("玉ねぎ楷書激無料版v7改.ttf")
            format("truetype");
        }

        /* タイトル */
        h1 {
            font-family: "Oiwai";

            font-size: 5em;

            text-align: center;

            line-height: 1.2em;

            font-weight: bold;

            color: transparent;

            background: repeating-linear-gradient(
                0deg,
                #B67B03 0.1em,
                #DAAF08 0.2em,
                #FEE9A0 0.3em,
                #DAAF08 0.4em,
                #B67B03 0.5em
            );

            -webkit-background-clip: text;
            background-clip: text;

            filter: drop-shadow(5px 5px 5px #ffffff);
        }

        /* 右下文字 */
        h2 {
            font-family: "Oiwai";

            font-size: 0.8em;

            color: white;

            position: fixed;

            right: 20px;
            bottom: 20px;

            margin: 0;

            text-shadow: 2px 2px 5px black;
        }

        /* ボタン全体 */
        button {

            font-family:"Oiwai";

            position: relative;

            width: 300px;
            height: 300px;

            margin: 15px;

            border-radius: 50%;

            border: none;

            font-size: 22px;

            font-weight: bold;

            cursor: pointer;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            transition: 0.2s;
    

    

            /* ぷっくり感 */
            box-shadow:
                inset 0 15px 25px rgba(255,255,255,0.5),
                inset 0 -20px 30px rgba(0,0,0,0.45),
                0 15px 25px rgba(0,0,0,0.45);

        }

        /* ボタン押下 */
        button:active {

            transform: translate(4px, 4px);

            box-shadow: 4px 4px 0px rgba(0,0,0,0.6);
        }

        button:hover {

            transform: scale(1.08);

        }

        /* ポーカー */
        #main1 {

            color: #008b8b;

            background:
                radial-gradient(circle, #fff 55%, transparent 56%),
                repeating-conic-gradient(
                    aqua 0deg 15deg,
                    #008b8b 15deg 30deg
                );
        }

        /* 大富豪 */
        #main2 {

            color: #4d9900;

            background:
                radial-gradient(circle, #fff 55%, transparent 56%),
                repeating-conic-gradient(
                    chartreuse 0deg 15deg,
                    #4d9900 15deg 30deg
                );
        }

        /* スロット */
        #main3 {

            color: #b84a3a;

            background:
                radial-gradient(circle, #fff 55%, transparent 56%),
                repeating-conic-gradient(
                    coral 0deg 15deg,
                    #b84a3a 15deg 30deg
                );
        }

        /* ブラックジャック */
        #main4 {

            color: #b30059;

            background:
                radial-gradient(circle, #fff 55%, transparent 56%),
                repeating-conic-gradient(
                    deeppink 0deg 15deg,
                    #b30059 15deg 30deg
                );
        }

        /* ボタン全体配置 */
        .button-area {

            text-align: center;

            margin-top: 100px;
        }

        /* ポーカー部分 */
        .coin-area {

            position: relative;

            display: inline-block;
        }

        /* チップ箱 */
        .chipbox1 {
            width: 250px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 400px;
            z-index: 0;
            pointer-events: none;
        }
        .chipbox2 {
            width: 250px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 350px;
            z-index: 0;
            pointer-events: none;
        }
        .chipbox3 {
            width: 200px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 320px;
            z-index: 0;
            pointer-events: none;
        }
        .chipbox4 {
            width: 250px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 350px;
            z-index: 0;
            pointer-events: none;
        }

    </style>
</head>


<body>
    <audio autoplay loop>

        <source src="casino.mp3" type="audio/mp3">

    </audio>

    <h1>BUGGING</h1>

    <h2>このゲームは合法です</h2>

    <div class="button-area">

        <!-- ポーカー -->
        <div class="coin-area">

            <button id="main1"
                onclick="location.href='poker/index.html'">

                ポーカー

            </button>

            <img src="card.png"
                 class="chipbox1">

        </div>

        <div class="coin-area">

            <button id="main2"
                onclick="location.href='daifugo/index.html'">

            大富豪

            </button>

            <img src="coin.png"class="chipbox2">

        </div>

        <!-- スロット -->
        <div class="coin-area">

            <button id="main3"
                onclick="location.href='slot/index.html'">

            スロット

            </button>

            <img src="slot.png"class="chipbox3">

        </div>

        

        

        <div class="coin-area">

            <button id="main4"
                onclick="location.href='blackjack/index.html'">

            ブラックジャック

            </button>

            <img src="dice.png"class="chipbox4">

        </div>

    </div>

    

</body>

</html>
