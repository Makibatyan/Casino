    <style>
        /* 背景を黒に設定 */
        body {
            background-color: black;
            margin: 0;
            padding: 0;
        }

        h1 {
            font-size: 5em;
            text-align: center;
            line-height: 1.2em;
            font-weight: bold;
            color: transparent;
            background: repeating-linear-gradient(0deg, #B67B03 0.1em, #DAAF08 0.2em, #FEE9A0 0.3em, #DAAF08 0.4em, #B67B03 0.5em); 
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(5px 5px 5px #ffffff);
        }

        h2 {
            font-size: 0.5em;
            text-align: right;
            color: white;
            padding-right: 20px;
        }

        /* ボタン全体の共通設定 */
        button {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 15px;
            border-radius: 50%;
            border: 4px solid #000; /* 外側の黒い縁取り */
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        /* ボタンクリック時の動作 */
        button:active {
            transform: translate(4px, 4px);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.6);
        }

        /* 各ボタンの扇形デザイン（中心の白円 + 扇形グラデーション） */
        
        #main1 {
            color: #008b8b;
            background:

                repeating-conic-gradient(coral 0deg 15deg, #b84a3a 15deg 30deg);
        }
