<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>大富豪</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Yuji+Syuku&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <button id="homeBtn">← ホームへ戻る</button>

    <div id="volume-control-pane">
        <span id="vol-icon font-cinzel">音量</span>
        <input type="range" id="global-volume-slider" min="0" max="1" step="0.05" value="0.3">
        <span id="global-volume-val">30%</span>
    </div>
    
    <div id="bgm-player" style="display: none;"></div>
    <h1>大富豪</h1>
    
    <div id="casino-header" style="max-width: 820px; margin: 10px auto; text-align: left; display: flex; justify-content: space-between; font-weight: bold; color: #ffd700; font-size: 1.2em; padding: 0 10px;">
        <div>💰 所持金: <span id="player-pelika">10,000,000</span> ペリカ</div>
        <div>🎲 現在の賭け金: <span id="current-bet-display">1,000,000</span> ペリカ</div>
    </div>

    <div id="bet-setup-area" style="max-width: 820px; margin: 20px auto; padding: 20px; background: rgba(0,0,0,0.85); border: 2px solid #ff4500; border-radius: 14px; text-align: center;">
        <h3 style="color: #ff4500; margin-top: 0;">ざわざわ… 賭け金（レート）を決定せよ …！</h3>
        <p style="color: #fff;">ギャンブラーなら、かける金額は決まっている！！！</p>
        <div style="margin: 20px 0;">
            <input type="range" id="bet-slider" min="1000000" max="10000000" step="1000000" value="1000000" style="width: 60%; accent-color: #ff4500;">
            <div style="font-size: 1.8em; color: #ffd700; margin-top: 10px; font-weight: bold;" id="bet-slider-val">1,000,000 ペリカ</div>
        </div>
        <button id="start-with-bet-btn" style="padding: 10px 30px; font-size: 1.2em; background: linear-gradient(180deg, #ff4500 0%, #8b0000 100%); color: #fff; border: 2px solid #ffd700; border-radius: 8px; cursor: pointer; font-weight: bold;">勝負開始（レイズ…！）</button>
    </div>
    
    <div id="game-container">
        <div id="revolution-status" style="font-weight: bold; color: yellow; margin-bottom: 10px;"></div>
        <div id="opponent-area">相手の手札: <span id="cpu-count">13</span>枚</div>
        
        <div id="field-area">
            <p>場に出ているカード</p>
            <div id="field-cards"></div>
        </div>

        <div id="player-area">
            <p>あなたの手札</p>
            <div id="player-hand" class="hand"></div>
        </div>

       <div id="controls">
            <button id="play-btn">出す</button>
            <button id="pass-btn">パス</button>
            <p id="msg"></p>
        </div>

        <div id="zawa-zawa-overlay" class="zawa-zawa-hidden">
            <div class="zawa top-left">ざわ…</div>
            <div class="zawa top-right">ざわ…</div>
            <div class="zawa bottom-left">ざわ…</div>
            <div class="zawa bottom-right">ざわ…</div>
        </div>
    </div> <script src="script.js"></script>
</body>
</html>
