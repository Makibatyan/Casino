<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>大富豪</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-screen" class="screen">
        

        <div class="start-card">
            <h1>大富豪</h1> <p class="kaiji-quote">「勝たなきゃゴミだ…！勝つことが全てだ…！」</p>
            <p class="desc">ペリカを賭けた究極の心理戦。生き残りをかけた大富豪が今、始まる。</p>
            
            
            <div class="bet-input-container">
                <h3 style="color: #ff4500; margin-top: 0;">ざわざわ… 賭け金（レート）を決定せよ …！</h3>
                
                <div class="chip-container" style="display: flex; justify-content: center; gap: 10px; margin: 15px 0;">
                    <button type="button" class="chip-btn" data-value="10000000">1000万</button>
                    <button type="button" class="chip-btn" data-value="30000000">3000万</button>
                    <button type="button" class="chip-btn" data-value="50000000">5000万</button>
                    <button type="button" class="chip-btn" data-value="allin" style="background: linear-gradient(135deg, #ff0055, #8b0000); color: #fff;">全賭け</button>
                    <button type="button" id="clear-bet-btn" style="background: #444; color: #fff; border: 1px solid #666; border-radius: 8px; padding: 5px 10px; cursor: pointer;">リセット</button>
                </div>

                <div style="font-size: 1.6em; color: #ffd700; margin-top: 10px; font-weight: bold;" id="bet-slider-val">0 ペリカ</div>
            </div>
            
            <button type="button" id="start-with-bet-btn" class="btn btn-gold">ゲーム開始</button>
            <button type="button" id="startHomeBtnInitial" class="btn btn-gold" style="display: block; margin: 15px auto 0 auto;">ホームへ戻る</button>
        </div>
    </div>
    <button id="homeBtn">← ホームへ戻る</button>

    <div id="volume-control-pane">
        <span id="vol-icon font-cinzel">音量</span>
        <input type="range" id="global-volume-slider" min="0" max="1" step="0.05" value="0.3">
        <span id="global-volume-val">30%</span>
    </div>
    
    <div id="bgm-player" style="display: none;"></div>
    <h1>大富豪</h1>
    
    <div id="casino-header" style="max-width: 820px; margin: 10px auto; text-align: left; display: flex; justify-content: space-between; font-weight: bold; color: #ffd700; font-size: 1.2em; padding: 0 10px;">
        <div> 所持金: <span id="player-pelika">10,000,000</span> ペリカ</div>
        <div> 現在の賭け金: <span id="current-bet-display">1,000,000</span> ペリカ</div>
    </div>
    
    
    
    <div id="game-container">
        <div id="revolution-status" style="font-weight: bold; color: yellow; margin-bottom: 10px;"></div>
        <div id="opponent-area">相手の手札: <span id="cpu-count">13</span>枚</div>
        
        <div id="field-area">
            <p>場に出ているカード</p>
            <div id="field-cards"></div>
        </div>

        <div id="player-area">
            <p>あなたの手札</p>
            <div id="player-hand" class="hand"></div>
        </div>

       <div id="controls">
            <button id="play-btn">出す</button>
            <button id="pass-btn">パス</button>
            <p id="msg"></p>
        </div>

        </div> <div id="zawa-zawa-overlay" class="zawa-zawa-hidden">
        <div class="zawazawa-text zawa-top-left">ざわ…<br>……ざわ</div>
        <div class="zawazawa-text zawa-top-right">ざわ…<br>ざわ……</div>
        <div class="zawazawa-text zawa-bottom-left">ざわ…<br>……ざわ</div>
        <div class="zawazawa-text zawa-bottom-right">ざわ…<br>ざわ……</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
