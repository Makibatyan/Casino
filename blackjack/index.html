<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カイジのブラックジャック</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-pattern" aria-hidden="true"></div>
  <div id="fx-overlay" class="fx-overlay" aria-hidden="true"></div>

  <!-- スタート画面 -->
  <div id="start-screen" class="screen active">
    <div class="start-card">
      <h1 class="title">カイジの<br><span>ブラックジャック</span></h1>
      <p class="subtitle">運命は自分の手で切り開く——</p>
      <div class="kaiji-portrait" aria-hidden="true">
        <span class="kaiji-face">開司</span>
      </div>
      <p id="start-quote" class="kaiji-quote">「俺は負けたままじゃ終われない…」</p>
      <label class="bankroll-setup">
        <span>初期所持コイン</span>
        <input type="number" id="initial-bankroll" min="100" max="999999" value="10000" step="100">
      </label>
      <button type="button" id="btn-start" class="btn btn-gold">ゲーム開始</button>
    </div>
  </div>

  <!-- メインゲーム -->
  <div id="game-screen" class="screen">
    <header class="hud">
      <div class="hud-block">
        <span class="hud-label">所持コイン</span>
        <span id="bankroll" class="hud-value">10,000</span>
      </div>
      <div class="hud-block center">
        <span class="hud-label">今回の獲得</span>
        <span id="session-coins" class="hud-value accent">0</span>
        <div class="sound-preset-row">
          <span class="preset-label">音質</span>
          <button type="button" id="btn-preset-a" class="btn-preset" title="やや控えめ">A</button>
          <button type="button" id="btn-preset-e" class="btn-preset active" title="リアル（推奨）">E</button>
        </div>
      </div>
      <div class="hud-block right">
        <span class="hud-label">連勝</span>
        <span id="win-streak" class="hud-value">0</span>
        <button type="button" id="btn-sound" class="btn-sound" aria-pressed="true" title="効果音のオン/オフ">🔊</button>
      </div>
    </header>

    <section class="kaiji-panel" aria-live="polite">
      <div class="kaiji-avatar" aria-hidden="true">開</div>
      <p id="kaiji-dialogue" class="kaiji-dialogue">「さあ、賭けの時間だ…」</p>
    </section>

    <main id="game-table" class="table">
      <section id="dealer-area" class="hand-area dealer-area">
        <h2>ディーラー <span id="dealer-score" class="score"></span></h2>
        <div id="dealer-cards" class="cards"></div>
      </section>

      <div class="table-center">
        <p id="game-message" class="game-message"></p>
        <div id="bet-panel" class="bet-panel">
          <p class="bet-label">ベット額を選べ</p>
          <p id="max-bet-hint" class="max-bet-hint">最大ベット: <strong id="max-bet">0</strong> コイン</p>
          <p id="bet-error" class="bet-error" role="alert"></p>
          <div class="bet-chips">
            <button type="button" class="chip" data-bet="100">100</button>
            <button type="button" class="chip" data-bet="500">500</button>
            <button type="button" class="chip" data-bet="1000">1K</button>
            <button type="button" class="chip" data-bet="2500">2.5K</button>
            <button type="button" class="chip" data-bet="5000">5K</button>
            <button type="button" class="chip chip-allin" data-bet="allin">ALL IN</button>
          </div>
          <div class="bet-custom">
            <input type="number" id="custom-bet" min="1" placeholder="任意額" step="50">
            <button type="button" id="btn-place-bet" class="btn btn-gold">ベットする</button>
          </div>
          <p class="current-bet">現在のベット: <strong id="current-bet">0</strong> コイン</p>
        </div>
      </div>

      <section id="player-area" class="hand-area player-area">
        <h2>あなた <span id="player-score" class="score"></span></h2>
        <div id="player-cards" class="cards"></div>
      </section>
    </main>

    <footer class="controls">
      <button type="button" id="btn-hit" class="btn btn-action" disabled>ヒット</button>
      <button type="button" id="btn-stand" class="btn btn-action" disabled>スタンド</button>
      <button type="button" id="btn-double" class="btn btn-action" disabled>ダブル</button>
      <button type="button" id="btn-new-round" class="btn btn-secondary" disabled>次のラウンド</button>
    </footer>
  </div>

  <!-- ゲームオーバー -->
  <div id="gameover-screen" class="screen">
    <div class="start-card gameover-card">
      <h1>破産</h1>
      <p id="gameover-quote" class="kaiji-quote">「まだ…終わってない…」</p>
      <p>最終所持: <strong id="final-bankroll">0</strong> コイン</p>
      <p>セッション獲得: <strong id="final-session">0</strong> コイン</p>
      <button type="button" id="btn-restart" class="btn btn-gold">最初から</button>
    </div>
  </div>

  <script src="sounds.js"></script>
  <script src="game.js"></script>
</body>
</html>
