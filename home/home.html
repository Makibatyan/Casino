<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BUGGING</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>BUGGING</h1>
        <div class="status-board">
            <div class="money-box-new">TOTAL: <span id="total-money">¥0</span></div>
            <div class="goal-box">目標まであと: <span id="remaining-goal">¥0</span></div>
        </div>
    </header>

    <div class="button-area">
        <button class="casino-btn" onclick="location.href='../poker/texas-holdem-poker.html'">ポーカー</button>
        <button class="casino-btn" onclick="location.href='../daifugo/index.html'">大富豪</button>
        <button class="casino-btn" onclick="location.href='../slot/index.html'">スロット</button>
        <button class="casino-btn" onclick="location.href='../blackjack/index.html'">ブラックジャック</button>
    </div>

    <div id="zawa-container"></div>
    <audio id="bgm" loop preload="auto">
        <source src="casino.mp3" type="audio/mpeg">
    </audio>

    <div class="volume-control">
        <label for="volume-slider">BGM音量</label>
        <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.3">
    </div>

    <div id="game-over-screen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; text-align:center; color:white; padding-top:200px;">
        <h1 style="color:#ff4444; font-size: 5rem;">GAME OVER</h1>
        <p style="font-size: 2rem; font-family: 'Oiwai';">所持金が尽きました……</p>
        <button class="casino-btn" onclick="resetMoney()">人生をやり直す</button>
    </div>

    <div id="clear-screen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; text-align:center; color:white; padding-top:200px;">
        <h1 style="color:#d4a84b; font-size: 5rem;">CONGRATULATIONS</h1>
        <p style="font-size: 2rem; font-family: 'Oiwai';">目標金額 240億を達成しました！</p>
        <button class="casino-btn" style="margin: 50px auto; width:200px; height:200px;" onclick="resetMoney()">閉じる</button>
    </div>

    <script src="script.js"></script>


</body>
</html>
