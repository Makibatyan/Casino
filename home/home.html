<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bugging</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgm" autoplay loop muted>
        <source src="casino.mp3" type="audio/mpeg">
    </audio>

    <div id="money-change">
        <span id="money-change-text"></span>
        <img id="money-change-img" src="" alt="">
    </div>

    <div class="money-box">
        <span class="money-text">TOTAL MONEY</span>
        <span id="money"></span>
    </div>

    <h1>BUGGING</h1>
    <h2>このゲームは合法です</h2>

    <div class="button-area">
        <div class="coin-area">
            <button id="main1" onclick="location.href='../poker/texas-holdem-poker.html'">ポーカー</button>
            <img src="card.png" class="chipbox1">
        </div>
        <div class="coin-area">
            <button id="main2" onclick="location.href='../daifugo/index.html'">大富豪</button>
            <img src="coin.png" class="chipbox2">
        </div>
        <div class="coin-area">

        </div>
        <div class="coin-area">
            <button id="main4" onclick="location.href='../blackjack/index.html'">ブラックジャック</button>
            <img src="dice.png" class="chipbox4">
        </div>
    </div>

    <div id="game-over-screen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; text-align:center; color:white; padding-top:200px;">
        <h1>GAME OVER</h1>
        <p style="font-size: 2em; font-family: 'Oiwai';">所持金が尽きました……</p>
        <button onclick="resetMoney()" style="width:300px; height:100px; border-radius:50px; font-size:2em; cursor:pointer;">人生やり直す</button>
    </div>


    <div id="clear-screen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; color:gold; text-align:center; z-index:9999; padding-top:200px;">
    <h1 style="font-size: 5em;">借金完済！</h1>
    <p style="font-size: 2em;">あなたは240億を稼ぎ出し、自由を手に入れた。</p>
    <button onclick="localStorage.clear(); location.reload();" style="font-size: 1.5em;">最初から遊ぶ</button>
</div>
    <script src="script.js"></script>
</body>
</html>
